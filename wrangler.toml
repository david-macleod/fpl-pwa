name = "fpl-h2h"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# The Worker serves ./public (the PWA) through the ASSETS binding.
# run_worker_first = true so /api/* always reaches the Worker; everything else the
# Worker hands to env.ASSETS.fetch. Deliberately no not_found_handling: there is no
# client-side router, so a missing file should be a real 404 rather than silently
# serving index.html.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[env.production]
routes = [
  { pattern = "fpl.macleod.in", custom_domain = true }
]

# Named envs do not inherit the top-level [assets] block — it has to be repeated.
[env.production.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.production.observability]
enabled = true
